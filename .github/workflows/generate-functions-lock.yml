name: Generate Functions lockfile

on:
  push:
    branches:
      - fix/auth-and-sheets-2026-09-07
    paths:
      - .github/workflows/generate-functions-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-and-sheets-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Generate lockfile
        run: npm install --prefix functions --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/package-lock.json
          git commit -m "Lock Firebase Functions dependencies"
          git push origin HEAD:fix/auth-and-sheets-2026-09-07
