name: Preview PR 41 Canonical JSON

on:
  push:
    branches:
      - chore/canonical-json-contract-v1
  workflow_dispatch:

concurrency:
  group: pr41-canonical-json-preview
  cancel-in-progress: true

jobs:
  verify-build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read

    env:
      FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
      PREVIEW_URL: 'https://wrs-firebase--pr41-canonical-json-a1azug7b.web.app'
      CHROME_BIN: '/usr/bin/google-chrome'

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      - name: Run verification suite
        run: npm test

      - name: Build standalone Firebase app
        run: npm run build:standalone

      - name: Prepare isolated QA identity and temporary auth helper
        run: node scripts/pr41-canonical-preview-e2e.mjs prepare

      - name: Deploy Hosting preview channel only
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
          projectId: wrs-firebase
          channelId: pr41-canonical-json
          expires: 7d

      - name: Install browser QA driver
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0

      - name: Run authenticated canonical browser QA
        run: node scripts/pr41-canonical-preview-e2e.mjs test

      - name: Preserve canonical QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr41-canonical-preview-qa-${{ github.sha }}
          path: |
            pr41-canonical-preview-qa-report.json
            pr41-canonical-preview-failure.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean isolated Firebase QA records and Auth user
        if: always()
        continue-on-error: true
        run: node scripts/pr41-canonical-preview-e2e.mjs cleanup

      - name: Scrub temporary auth helper from preview channel
        if: always() && steps.preview.outcome == 'success'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
          projectId: wrs-firebase
          channelId: pr41-canonical-json
          expires: 7d
