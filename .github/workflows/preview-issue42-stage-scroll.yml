name: Preview Issue 42 Lesson Stage Scroll

on:
  push:
    branches:
      - fix/issue-42-lesson-stage-scroll
  workflow_dispatch:

concurrency:
  group: issue42-stage-scroll-preview
  cancel-in-progress: true

jobs:
  verify-build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read

    env:
      FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
      CHROME_BIN: '/usr/bin/google-chrome'

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      - name: Run verification suite
        run: npm test

      - name: Build standalone Firebase app
        run: npm run build:standalone

      - name: Prepare isolated QA identity and temporary auth helper
        run: node --import tsx scripts/issue42-preview-e2e.mjs prepare

      - name: Deploy Hosting preview channel only
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
          projectId: wrs-firebase
          channelId: issue42-stage-scroll
          expires: 7d

      - name: Install browser QA driver
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0

      - name: Run authenticated Issue 42 browser QA
        env:
          PREVIEW_URL: '${{ steps.preview.outputs.details_url }}'
        run: node --import tsx scripts/issue42-preview-e2e.mjs test

      - name: Preserve Issue 42 QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue42-stage-scroll-qa-${{ github.sha }}
          path: |
            issue42-preview-qa-report.json
            issue42-preview-qa-failure.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean isolated Firebase QA records and Auth user
        if: always()
        continue-on-error: true
        env:
          PREVIEW_URL: '${{ steps.preview.outputs.details_url }}'
        run: node --import tsx scripts/issue42-preview-e2e.mjs cleanup

      - name: Scrub temporary auth helper from preview channel
        if: always() && steps.preview.outcome == 'success'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
          projectId: wrs-firebase
          channelId: issue42-stage-scroll
          expires: 7d
