name: Verify v33 outside ChatGPT

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      - name: Build and run tests
        run: npm test

      - name: Lint changed TypeScript sources
        run: |
          bash scripts/sites-env.sh -- ./node_modules/.bin/eslint \
            legacy/App.tsx \
            legacy/components/modules/Part10Listening.tsx \
            legacy/components/modules/PassageReading.tsx \
            legacy/components/modules/QuickDrill.tsx \
            legacy/components/modules/Spelling.tsx \
            legacy/lessonSessionSync.ts \
            legacy/presenterMode.ts \
            legacy/types.ts \
            legacy/useLessonSession.ts \
            tests/canonical-2-5-v2.test.ts \
            tests/canonical-lesson-surfaces.test.tsx \
            tests/lesson-session.test.ts \
            tests/part7-presenter-privacy.test.ts

      - name: Validate Firebase Functions source
        run: node --check functions/index.js
