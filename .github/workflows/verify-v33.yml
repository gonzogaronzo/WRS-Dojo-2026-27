name: Verify v33 outside ChatGPT

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run existing tests
        run: npm test

      - name: Build standalone site when present
        run: |
          if npm run | grep -q 'build:standalone'; then
            npm run build:standalone
          else
            echo 'No standalone build script on this branch yet.'
          fi
