name: Temporary Issue 27 Part 2 preview

on:
  push:
    branches:
      - preview/issue-27-part2-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out PR #28 source
        uses: actions/checkout@v4
        with:
          ref: eb4698296713d1bf7562ac25af5911a71d08a3de

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run full verification suite
        run: npm test

      - name: Build standalone Firebase app
        run: npm run build:standalone

      - name: Deploy temporary Hosting preview only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
          projectId: wrs-firebase
          channelId: issue-27-part2-eb469829
          expires: 7d
          entryPoint: .
          disableComment: 'true'
