name: PR48 Lesson Orchestration

on:
  push:
    branches:
      - feature/lesson-planning-orchestration-v1
  pull_request:
    branches:
      - independent-hosting
    paths:
      - 'scripts/wrs-lesson-*.mjs'
      - 'tests/lesson-*.test.mjs'
      - 'schemas/wrs-*.schema.json'
      - 'curriculum/source-packets/**'
      - 'curriculum/pilots/**'
      - 'docs/WRS_LESSON_PLANNING_ORCHESTRATION_V1.md'
      - 'package.json'
      - '.github/workflows/pr48-lesson-orchestration.yml'

concurrency:
  group: wrs-dojo-pr48-lesson-orchestration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestration-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out exact PR48 commit
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run orchestration and fingerprint unit tests
        run: node --test tests/lesson-orchestrator.test.mjs tests/lesson-build-fingerprint.test.mjs

      - name: Parse orchestration schemas, source packets, and pilot runtime
        run: |
          node -e "const fs=require('fs'); for (const f of ['schemas/wrs-group-planning-snapshot-v1.schema.json','schemas/wrs-substep-source-packet-v1.schema.json','schemas/wrs-lesson-build-request-v1.schema.json','schemas/wrs-weekly-build-queue-v1.schema.json','curriculum/source-packets/5.5.v1.json','curriculum/pilots/5b-5.5-introduction-conditional.json']) JSON.parse(fs.readFileSync(f,'utf8')); console.log('JSON parse PASS')"

  pr40-canonical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: orchestration-contracts

    steps:
      - name: Check out exact PR48 commit
        uses: actions/checkout@v4

      - name: Check out pinned PR40 gate
        uses: actions/checkout@v4
        with:
          ref: f5816d321da91d568ef7fbde5e2f1d7591e7d786
          path: pr40-gate

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install pinned PR40 dependencies
        working-directory: pr40-gate
        run: npm ci

      - name: Run 5B 5.5 pilot through pinned PR40 canonical gate
        id: canonical_gate
        working-directory: pr40-gate
        run: |
          npx tsx -e "import fs from 'node:fs'; import { validateCanonicalLessonGate } from './legacy/canonicalLessonGate.ts'; const runtime=JSON.parse(fs.readFileSync('../curriculum/pilots/5b-5.5-introduction-conditional.json','utf8')); const result=validateCanonicalLessonGate(runtime); fs.writeFileSync('../pr40-gate-result.json',JSON.stringify(result,null,2)); console.log(JSON.stringify(result,null,2)); if(!result.ok) process.exit(1);"

      - name: Preserve PR40 canonical-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr48-pr40-canonical-gate-${{ github.sha }}
          path: pr40-gate-result.json
          if-no-files-found: error
          retention-days: 7
