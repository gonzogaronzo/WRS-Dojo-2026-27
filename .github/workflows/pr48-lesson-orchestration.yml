name: PR48 Lesson Orchestration

on:
  push:
    branches:
      - feature/lesson-planning-orchestration-v1
  pull_request:
    branches:
      - independent-hosting
    paths:
      - 'scripts/wrs-lesson-orchestrator.mjs'
      - 'tests/lesson-orchestrator.test.mjs'
      - 'schemas/wrs-*.schema.json'
      - 'curriculum/source-packets/**'
      - 'docs/WRS_LESSON_PLANNING_ORCHESTRATION_V1.md'
      - 'package.json'
      - '.github/workflows/pr48-lesson-orchestration.yml'

concurrency:
  group: wrs-dojo-pr48-lesson-orchestration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestration-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run orchestration unit tests
        run: node --test tests/lesson-orchestrator.test.mjs

      - name: Parse orchestration schemas and source packets
        run: |
          node -e "const fs=require('fs'); for (const f of ['schemas/wrs-group-planning-snapshot-v1.schema.json','schemas/wrs-substep-source-packet-v1.schema.json','schemas/wrs-lesson-build-request-v1.schema.json','curriculum/source-packets/5.5.v1.json']) JSON.parse(fs.readFileSync(f,'utf8')); console.log('JSON parse PASS')"
