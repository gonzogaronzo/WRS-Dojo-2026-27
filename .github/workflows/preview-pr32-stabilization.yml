name: Preview PR 32 stabilization

on:
  push:
    branches:
      - preview/pr32-stabilization

concurrency:
  group: wrs-dojo-pr32-preview
  cancel-in-progress: true

jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13e676aeb008e1f54239166393afa2b536260988
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions
      - name: Verify integrated stabilization
        run: npm test
      - name: Build standalone preview
        run: npm run build:standalone
      - name: Deploy preview-only Hosting channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
          projectId: wrs-firebase
          channelId: pr32-stabilization
          expires: 7d
