name: Firebase integration preflight

on:
  push:
    branches:
      - fix/auth-and-sheets-2026-09-07
    paths:
      - .github/workflows/firebase-integration-preflight.yml

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Firebase credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Verify Firebase project access
        run: npx --yes firebase-tools@14.15.2 projects:list --json

      - name: Check existing Functions visibility
        shell: bash
        run: |
          npx --yes firebase-tools@14.15.2 functions:list --project wrs-firebase --json || true

      - name: Inspect relevant Google Cloud services
        shell: bash
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null
          gcloud config set project wrs-firebase >/dev/null
          echo "ENABLED_RELEVANT_SERVICES"
          gcloud services list --enabled \
            --filter='config.name:(cloudfunctions.googleapis.com sheets.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com)' \
            --format='value(config.name)' || true
          echo "BILLING_STATUS"
          gcloud beta billing projects describe wrs-firebase --format='value(billingEnabled)' || true
