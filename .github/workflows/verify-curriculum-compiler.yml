name: Verify curriculum compiler

on:
  pull_request:
    paths:
      - 'curriculum-compiler/**'
      - '.github/workflows/verify-curriculum-compiler.yml'
  workflow_dispatch:

jobs:
  verify-compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compiler dependencies
        run: python -m pip install -r curriculum-compiler/requirements.txt
      - name: Compile Python sources
        run: python -m py_compile curriculum-compiler/compiler.py curriculum-compiler/selection_fidelity.py curriculum-compiler/main.py
      - name: Run fail-closed compiler tests
        working-directory: curriculum-compiler
        run: python -m unittest -v test_compiler.py test_selection_fidelity.py
