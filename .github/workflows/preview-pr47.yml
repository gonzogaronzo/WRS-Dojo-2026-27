name: Preview PR 47 on Firebase Hosting

on:
  push:
    branches:
      - fix/operational-director-parts-6-10
  workflow_dispatch:

concurrency:
  group: wrs-dojo-pr47-preview
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused Task 8 privacy fix
        run: |
          python scripts/task8_apply_privacy_fix.py
          python scripts/task8_test_adjust.py

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      - name: Run targeted Part 6 and Part 8 privacy tests
        run: node --import tsx --test tests/part6-part8-preview-privacy.test.tsx tests/canonical-lesson-surfaces.test.tsx tests/presenter-mode.test.ts

      - name: Run verification suite
        run: npm test

      - name: Build standalone Firebase app
        run: npm run build:standalone

      - name: Commit focused Task 8 fix
        run: |
          if git diff --quiet; then
            echo 'No Task 8 source changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add legacy/presenterMode.ts legacy/components/modules/QuickDrill.tsx tests/canonical-lesson-surfaces.test.tsx tests/part6-part8-preview-privacy.test.tsx package.json
            git commit -m 'fix: gate Part 6 and Part 8 student answers until reveal'
            git push origin HEAD:fix/operational-director-parts-6-10
          fi

      - name: Deploy Hosting preview channel only
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
          projectId: wrs-firebase
          channelId: pr47-review
          expires: 7d
