name: Mission scroll preview validation

on:
  push:
    branches:
      - fix/mission-screen-scroll
  workflow_dispatch:

concurrency:
  group: mission-scroll-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run full verification suite
        run: npm test

      - name: Build standalone Firebase app
        run: npm run build:standalone

      - name: Deploy Firebase Hosting preview only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
          projectId: wrs-firebase
          channelId: mission-scroll
          expires: 7d
