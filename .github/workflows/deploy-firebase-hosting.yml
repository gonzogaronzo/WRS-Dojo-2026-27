name: Deploy WRS Dojo to Firebase Hosting

on:
  push:
    branches:
      - independent-hosting
  workflow_dispatch:

concurrency:
  group: wrs-dojo-firebase-production
  cancel-in-progress: false

jobs:
  verify-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      - name: Run verification suite
        run: npm test

      - name: Validate Firebase Functions source
        run: node --check functions/index.js

      - name: Build standalone Firebase app
        run: npm run build:standalone

      - name: Deploy Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}'
          projectId: wrs-firebase
          channelId: live

      - name: Prepare Firebase deploy credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WRS_FIREBASE }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy data-mirror Functions
        run: npx --yes firebase-tools@14.15.2 deploy --only functions --project wrs-firebase --non-interactive
